group: Modules & Hierarchy
cases:
  - id: submodule-instance
    title: Submodule Instance
    description: Instantiating a submodule creates a hierarchical module instance block.
    tags: [instance, hierarchy, source-highlight]
    files:
      child.sv: |
        module child (
          input logic a,
          output logic b
        );
          assign b = a;
        endmodule
      top.sv: |
        module top (
          input logic a,
          output logic b
        );
          child u_child (.a(a), .b(b));
        endmodule
    module: top
    target:
      kind: node
      nodeKind: instance
      nodeLabel: u_child
      action: doubleClick
    expect:
      nodeKinds: [port, instance]
      selectedText: "child u_child (.a(a), .b(b));"

  - id: submodule-parameterized
    title: Parameterized Submodule Instance
    description: Instantiating a submodule with both default parameters and overridden values.
    tags: [instance, hierarchy, parameter, source-highlight]
    files:
      top.sv: |
        module child #(
          parameter WIDTH = 8,
          parameter DEPTH = 4
        ) (
          input logic [WIDTH-1:0] a,
          output logic [WIDTH-1:0] b
        );
          assign b = a;
        endmodule

        module top (
          input logic [7:0] a,
          output logic [7:0] b
        );
          child #(.WIDTH(8)) u_child (
            .a(a),
            .b(b)
          );
        endmodule
    module: top
    target:
      kind: node
      nodeKind: instance
      nodeLabel: u_child
      action: doubleClick
    expect:
      nodeKinds: [port, instance]
      selectedText: |
        child #(.WIDTH(8)) u_child (
            .a(a),
            .b(b)
          );

  - id: submodule-instance-array
    title: Instance Array
    description: Instantiating a submodule with a [MSB:LSB] range collapses the whole array into a single stacked instance node.
    tags: [instance, hierarchy, array, source-highlight]
    files:
      child.sv: |
        module child (
          input logic a,
          output logic b
        );
          assign b = a;
        endmodule
      top.sv: |
        module top (
          input logic a [3:0],
          output logic b [3:0]
        );
          child u_child [3:0] (
            .a (a),
            .b (b)
          );
        endmodule
    module: top
    target:
      kind: node
      nodeKind: instance
      nodeLabel: u_child
      action: doubleClick
    expect:
      nodeKinds: [port, instance]
      targetIsArray: true
      selectedText: "u_child"

  - id: function-call-block
    title: Function Call Block
    description: >-
      Calling an automatic function renders the call site as a FUNCTION
      block; double-clicking it unfolds the function's own combinational
      body in place.
    tags: [function, callable, display]
    files:
      top.sv: |
        module top (
          input  logic [7:0] a,
          input  logic [7:0] b,
          output logic [7:0] y
        );
          function automatic [7:0] foo(
            input [7:0] lhs,
            input [7:0] rhs
          );
            foo = lhs + rhs;
          endfunction

          assign y = foo(a, b);
        endmodule
    module: top
    target:
      kind: display
      nodeKind: funcCall
      nodeLabel: foo
    expect:
      nodeKinds: [port, funcCall]
      selectedText: "foo(a, b)"

  - id: task-call-block
    title: Task Call Block
    description: >-
      Calling an automatic task from a procedural block renders the call
      site as a TASK block, styled the same as a function call.
    tags: [task, callable, display]
    files:
      top.sv: |
        module top (
          input  logic [7:0] a,
          input  logic [7:0] b,
          output logic [7:0] y
        );
          task automatic add_values(
            input  logic [7:0] lhs,
            input  logic [7:0] rhs,
            output logic [7:0] result
          );
            result = lhs + rhs;
          endtask

          always_comb begin
            add_values(a, b, y);
          end
        endmodule
    module: top
    target:
      kind: display
      nodeKind: taskCall
      nodeLabel: add_values
    expect:
      nodeKinds: [port, taskCall]
      selectedText: "add_values(a, b, y)"
